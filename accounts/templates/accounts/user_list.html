<h1>Manage Users</h1>

<a href="{% url 'accounts:user_create' %}">Add User</a>
<br><br>

<table border="1" cellpadding="8">
    <tr>
        <th>Username</th>
        <th>Email</th>
        <th>Role</th>
        <th>Department</th>
        <th>Status</th>
    </tr>

    {% for user in users %}
    <tr>
        <td>{{ user.username }}</td>
        <td>{{ user.email }}</td>
        <td>{{ user.role }}</td>
        <td>{{ user.department }}</td>
        <td>
            {% if user.is_active %}
                Active
            {% else %}
                Disabled
            {% endif %}
        </td>
    </tr>
    {% endfor %}
</table>
