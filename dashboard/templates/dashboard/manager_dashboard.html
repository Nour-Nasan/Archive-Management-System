<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manager Dashboard | Archive System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" href="#">Archive System</a>
        <div class="ms-auto d-flex align-items-center gap-3">
            <span class="text-light">{{ request.user.username }}</span>
            <a href="{% url 'accounts:logout' %}" class="btn btn-outline-light btn-sm">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <h4 class="mb-4">Manager Dashboard</h4>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card shadow-sm h-100">
                <div class="card-body">
                    <h6 class="card-title text-muted text-uppercase small fw-bold mb-3">Documents</h6>
                    <div class="d-grid gap-2">
                        <a href="{% url 'documents:document_list' %}" class="btn btn-outline-primary">
                            📄 View All Documents
                        </a>
                        <a href="{% url 'documents:document_create' %}" class="btn btn-primary">
                            + Add Document
                        </a>
                    </div>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
