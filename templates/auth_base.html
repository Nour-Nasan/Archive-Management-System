<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Archive System{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --c-bg:      #F5F1E8;
            --c-card:    #FCFAF5;
            --c-primary: #6F8575;
            --c-primary-h:#5D7263;
            --c-text:    #2F3832;
            --c-muted:   #737A73;
            --c-border:  #DED8CC;
            --c-accent:  #E9E1D3;
            --c-sidebar: #4F6256;
            --c-success: #4a7c59;
            --c-danger:  #8b3a3a;
            --c-warning: #9a6c2c;
        }
        html, body { height: 100%; }
        body {
            background: var(--c-bg);
            color: var(--c-text);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            font-size: 0.9rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 100vh; padding: 1.5rem 1rem;
        }
        .auth-card {
            background: var(--c-card); border: 1px solid var(--c-border);
            border-radius: 0.625rem; box-shadow: 0 2px 16px rgba(0,0,0,0.08);
            width: 100%; max-width: 440px; padding: 2rem;
        }
        .auth-logo { font-size: 1.2rem; font-weight: 700; color: var(--c-sidebar); letter-spacing: 0.01em; }
        .auth-logo-sub { color: var(--c-muted); font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; }
        .auth-title { font-size: 1.05rem; font-weight: 650; color: var(--c-text); margin-bottom: 0.2rem; }
        .auth-subtitle { color: var(--c-muted); font-size: 0.82rem; }

        .form-label { font-weight: 500; font-size: 0.875rem; color: var(--c-text); margin-bottom: 0.3rem; }
        .form-control, .form-select {
            border-color: var(--c-border); background: #fff; color: var(--c-text);
            border-radius: 0.375rem; font-size: 0.875rem;
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--c-primary);
            box-shadow: 0 0 0 0.18rem rgba(111,133,117,0.22);
        }
        .form-text { color: var(--c-muted); font-size: 0.78rem; }

        .btn-primary { background-color: var(--c-primary); border-color: var(--c-primary); color: #fff; border-radius: 0.375rem; font-size: 0.875rem; }
        .btn-primary:hover { background-color: var(--c-primary-h); border-color: var(--c-primary-h); color: #fff; }
        .btn-outline-secondary { border-color: var(--c-border); color: var(--c-muted); background: transparent; border-radius: 0.375rem; font-size: 0.875rem; }
        .btn-outline-secondary:hover { background: var(--c-accent); border-color: var(--c-border); color: var(--c-text); }

        .auth-divider { border-color: var(--c-border); margin: 1.25rem 0; }
        .auth-link { color: var(--c-primary); text-decoration: none; font-weight: 500; }
        .auth-link:hover { text-decoration: underline; }
        .auth-switch { background: var(--c-accent); border: 1px solid var(--c-border); border-radius: 0.5rem; padding: 0.75rem 1rem; margin-bottom: 1.5rem; }

        .alert { border-radius: 0.4rem; font-size: 0.875rem; padding: 0.65rem 0.875rem; }
        .alert-danger  { background:#f8edee; border-color:#e4b4b4; color:#6b2424; }
        .alert-warning { background:#faf4e8; border-color:#dfc98e; color:#6b4a1a; }
        .alert-success { background:#edf4ee; border-color:#b4d4ba; color:#2f5735; }
        .alert-info    { background:#e8f1f8; border-color:#9fc4d8; color:#1e4d68; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
